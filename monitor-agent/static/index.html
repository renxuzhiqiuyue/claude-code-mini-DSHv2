<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>monitor-agent · .memory</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">monitor-agent</div>
    <div class="meta" id="rootMeta">加载中…</div>
  </header>
  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">文件</div>
      <div class="tree" id="tree"></div>
    </aside>
    <section class="viewer" id="viewer">
      <div class="empty" id="emptyHint">从左侧选择 session JSON 或其它文件</div>
      <div class="viewer-body hidden" id="viewerBody">
        <div class="file-head">
          <h1 id="fileTitle"></h1>
          <div class="file-meta" id="fileMeta"></div>
        </div>
        <div id="textPane" class="text-pane hidden"></div>
        <div id="messagesPane" class="messages"></div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
